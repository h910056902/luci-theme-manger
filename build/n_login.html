		function uptime2dhms(uptime, max = 5, delim = ' '){
			if(!uptime){
				return "-";
			}
			var dhms=[];
			if (uptime >= 60*60*24){
				dhms.push(Math.floor(uptime/(60*60*24))+'d');
			}
			if (uptime >= 60*60){
				dhms.push(Math.floor(uptime%(60*60*24)/60/60)+'h');
			}
			if (uptime >= 60){
				dhms.push(Math.floor(uptime%(60*60)/60)+'m');
			}
			dhms.push(Math.floor(uptime%60)+'s');
			return dhms.slice(0, max).join(delim);
		}

		var	gSmsIfaces = null;

		function render_sms_badge(count,clean){
			var $badge = $('.sms-badge');
			if(!$badge.length) return;
			if(clean){
				$('.sms-li').addClass("blink");
				$badge.removeClass('hide').html('<i class="far fa-nradio-del fa-fw" ></i> ');
			}
			else if(!count || count <= 0){
				$('.sms-li').removeClass("blink");
				$badge.addClass('hide').text('');
			}else{
				$('.sms-li').removeClass("blink");
				$badge.removeClass('hide').text(count > 99 ? '99+' : String(count));
			}
		}
		function sms_unread_core(data){
			gSmsIfaces = null;
			var count = 0;
			var total = 0;
			var used = 0;
			var clean_flag = 0;
			
			if(data){
				for( var i = 0; i < data.length; i++){
					var item = data[i];
					if (item.max)
						total+=item.max;
					if (item.used)
						used+=item.used;
					if(item.count > 0 && item.iface){
						gSmsIfaces = item.iface;
						count = item.count + count;
					}
				}
				gSmsUnread = count;
				if(total && (used*100/total >= 90))
					clean_flag = 1;
				
				//console.log("used:"+used+",total:"+total+" "+used*100/total);
				render_sms_badge(count,clean_flag);
			}
		}
		function refresh_sms_badge(){
			if(GlobalSyncRQ.runtime || GlobalSyncRQ.cellinfo || GlobalSyncRQ.celldevice || GlobalSyncRQ.siminfo || GlobalSyncRQ.client)
				return;
			(new XHR()).get('/cgi-bin/luci/nradio/cellular/sms/unread', null, function(xhr){
				if (xhr.getResponseHeader("Content-Type") == "application/json") {
					try {
						var data_res = eval('(' + xhr.responseText + ')');
						if(data_res && data_res.result && data_res.result.sms_unread && data_res.result.sms_unread.length > 0){
							sms_unread_core(data_res.result.sms_unread);
						}					
					}
					catch(e) {
					}
				}
			});
		}

			else

		}

		if(check_5ga(status.sim_company,mode,status.band_count,bandcombine)){

		});
	}

function escapeHtml(str) {
  return str.replace(/[<>&"']/g, function(match) {
    switch (match) {
      case '<':
        return '&lt;';
      case '>':
        return '&gt;';
      case '&':
        return '&amp;';
      case '"':
        return '&quot;';
      case "'":
        return '&#039;';
    }
  });
}
function secret_show(val){
	var htm = "";
	var target_val = val;
	var secret_word = val;
	var far_class = "fa-nradio-eye-open";
	if (typeof(val) == "number")
		val = val.toString();
	else if (typeof(val) != "string")
		return "";
	else if(!val.length)
		return "";
	
	secret_word = val.replace(/./g, "·");
	val = escapeHtml(val);
	if(secretshow){
		target_val = secret_word;
		far_class = "fa-nradio-eye-close";
	}

	htm = '<span class="word_info" data-ori="'+val+'" data-secret="'+secret_word+'">'+target_val+'</span><span class="icon toggle_eye" > <i class="far '+far_class+' fa-1x"></i></span>';
	return htm;
}

function format_wans_box(wans_data,cpe_count,canvas_size){
	var html="";
	var canvas_html="";
	var speedflow_html="";
	var cpe_index = 0;
	var count = 1;
	var active_index = -1;
	var wired_index = 0;
	var cellular_nr_index = 0;
	var cellular_lte_index = 0;

	var nbcpe_index = 0;
	var count_info = get_wans_count(wans_data);
	for(var i=0;i<wans_data.length;i++){
		var data = wans_data[i].name;
		var class_name = "";		
		var cpe_data = "";
		var label_info = "";
		var label_detail_info = "";
		var pre_label_info = "Line"+count+"-";

		if(wans_data[i].disabled != "1"){
			count++;
		}
		
		if(wans_data[i].type == "wired"){
			wired_index++;
			pre_label_info = get_wans_prefix_name(wans_data[i],count_info.wired,wired_index);
			class_name="wan_box";
			label_info = " Connection";
			label_detail_info = " Details";
		}
		else if(wans_data[i].type == "cellular"){
			cpe_index++;
			cpe_data='data-cpeindex="'+cpe_index+'"';
			class_name="cpe_box";
			if(wans_data[i].odu == 1){
				nbcpe_index++;
				pre_label_info = get_wans_prefix_name(wans_data[i],count_info.nbcpe,nbcpe_index);
			}				
			else{
				if(wans_data[i].nrcap == "1"){
					cellular_nr_index++;
					pre_label_info = get_wans_prefix_name(wans_data[i],count_info.cellular_nr,cellular_nr_index);
				}
				else{
					cellular_lte_index++;
					pre_label_info = get_wans_prefix_name(wans_data[i],count_info.cellular_lte,cellular_lte_index);				
				}				
			}
				
			label_info = " Signal";
			label_detail_info = " Details";

		}
		wans_data[i].singlecanvas=format_wans_icon_box(data,class_name,cpe_data,pre_label_info,label_info,"single",canvas_size);
		wans_data[i].multicanvas=format_wans_icon_box(data,class_name,cpe_data,pre_label_info,label_info,"multi",canvas_size);
		wans_data[i].detail=format_wans_detail_box(data,class_name,cpe_data,pre_label_info,label_detail_info);
		wans_data[i].singlespeedflow=format_wans_speedflow_box(data,class_name,cpe_data,"","single");
		wans_data[i].multispeedflow=format_wans_speedflow_box(data,class_name,cpe_data,"","multi");

		$("#multi-box").append(wans_data[i].multicanvas+wans_data[i].detail+"<div class='stand_net_box speedflow_combine_box box_wans_"+wans_data[i].name+"'>"+wans_data[i].multispeedflow+"</div>");
		if(wans_data[i].disabled != "1"){
			if(active_index == -1){
				active_index = i;
				$("#single-box").data("module",wans_data[i].name);
				$("#canvas-box").html(wans_data[i].singlecanvas);
				$("#single-box .speedflow_combine_box").removeClass("hide").html(wans_data[i].singlespeedflow);
				$("#net-box").html(wans_data[i].detail);				
			}
		}
	};
	reset_box_item(wans_data);
	reset_box_speed(wans_data);
}

function reset_box_item(wans_data){
	var show_count = 0;
	var item = null;
	var index = 0;

	for(var i=0;i<wans_data.length;i++){
		 if(wans_data[i].disabled != "1"){
			show_count++;
			/*var pre_label_info = "Line"+show_count+"-";
			$("#multi-box").find(".box_wans_"+wans_data[i].name).each(function(){
				$(this).find(".pre_info").html(pre_label_info);
			});*/
			item = wans_data[i];
		 }
	}

	if(show_count>1){
		$("#single-box").addClass("hide");
		$("#single_net_wifi").addClass("hide");
		$("#multi_net_wifi").removeClass("hide");
		$("#multi-box").removeClass("hide");		
	}
	else if(show_count==1){
		var cur_module = $("#single-box").data("module");

		if(cur_module != item.name){
			$("#single-box").data("module",item.name);
			$("#canvas-box").html(item.singlecanvas);
			$("#single-box .speedflow_combine_box").removeClass("hide").html(item.singlespeedflow);
			$("#net-box").html(item.detail);
			item.arcProgressSingle = null;
			item.arcProgressMEMSingle = null;
			item.arcProgressTempSingle = null;
			item.arcProgressCPUSingle = null;
		}
		else{
			$("#single-box .speedflow_combine_box").removeClass("hide");
		}
		$("#single-box").removeClass("hide");
		$("#single_net_wifi").removeClass("hide");
		$("#multi_net_wifi").addClass("hide");
		$("#multi-box").addClass("hide");	
	}
	else{
		$("#single-box").removeClass("hide");
		$("#single-box .speedflow_combine_box").addClass("hide");
		$("#single_net_wifi").removeClass("hide");
		$("#multi_net_wifi").addClass("hide");
		$("#multi-box").addClass("hide");	
	}
	//$("#single-box").find(".pre_info").html("");
	$("#single-box").find(".last_info").html("");
	$("#single-box .box_wans_wan").find(".rtemp_label").html("CPU Usage");	
	//$("#multi-box .box_wans_wan .pre_info").html("");
	$("#multi-box .box_wans_wan .rtemp_label").html("CPU Usage");
	$(".device-panel").removeClass("hide");
}
function lan_show(data){
	var lan_one_data = data[0];
	var lan_ip_html="";
	var lan_ip_secret_html="";
	var cat_lan_ip_secret_html="";
	var cat_lan_ip_html="";
	var lan_ip="";
	var ip_count = 0;
	if (lan_one_data) {
		if (lan_one_data.ipaddrs && lan_one_data.ipaddrs.length) {
				for(i=0;i<lan_one_data.ipaddrs.length;i++){
					var ip_show = lan_one_data.ipaddrs[i].ipaddr;
					if (ip_show){
						var split_index = ip_show.search("/");
						if(-1 != split_index){
							ip_show = ip_show.substr(0, split_index);
							lan_ip+=ip_show+" ";
							var cat_ip_show=ip_show;
							if(ip_show.indexOf(":")!=-1){
								var ip_len = ip_show.length;
								if(ip_len>17){
									cat_ip_show=ip_show.substr(0,17)+"...";
								}
							}
							ip_count++;
							if(ip_count>2)
								continue;
							lan_ip_html=lan_ip_html+ip_show+"<br>";
							lan_ip_secret_html=lan_ip_secret_html+'<div onclick="toggle_eye_show(this,secretshow)">'+secret_show(ip_show)+'</div>';
							
							cat_lan_ip_html=cat_lan_ip_html+cat_ip_show+"<br>";
							cat_lan_ip_secret_html=cat_lan_ip_secret_html+'<div onclick="toggle_eye_show(this,secretshow)">'+secret_show(cat_ip_show)+'</div>';
						}

					}
				}
				$('.visible-lg.lan_ip').html(lan_ip_secret_html);
				$('.hidden-lg.lan_ip').html(cat_lan_ip_secret_html);
				$('.lan_ip').prop("title",lan_ip);
			}
	}
}

function net_show(data,cpe_data,isWanLinked,nbcpe_linked){
	var cpe_up = false;
	var wan_up = false;
	var port_link = isWanLinked;
	$(".stand_net_box").each(function(){
		$(this).data('disabled',"1");
		$(this).find(".wan_uptime").data("uptime","");
	});
	reset_wans_item(wans_data);
	$(".wired_gateway").html("");
	if (data) {
		wan_up = false;
		cpe_up = false;
		var cpe_index = 999;
		$('.wan_ip').text("");
		$('.wan_mask').text("");
		$('.wan_ip').data("ip","");
		$('.wan_ip').data("ip_count","");

		$.each(data, function(i, db){
			var wan_item = get_wans_item(db.classname,wans_data);
			if(!wan_item)
				return;

			wan_item.disabled="0";				
			$('.box_wans_'+db.classname).data('disabled',"0");
			
			if(db.status == 0 ){
				if (db.proto_text && db.proto_text.length)
					db.proto_text+="<br>";
				else
					db.proto_text="";
				db.proto_text +=proto[db.proto];
				if(wan_item.type == "wired"){				
					wan_up = true;					
				}
				if((wan_item.type == "cellular") && cpe_count && $('.box_wans_'+db.classname).length){
					cpe_up = true;
				}
				
				if(db.proto == "dhcp"){
					if(db.uptime ){
						$('.box_wans_'+db.classname+' .wan_uptime').html(uptime2dhms(db.uptime, 3));
						$('.box_wans_'+db.classname+' .wan_uptime').data("uptime",db.uptime);
					}						
				}
				else{
					if(db.uptime){
						var last_data = $('.box_wans_'+db.classname+' .wan_uptime').data("uptime");
						if(!last_data ){
							$('.box_wans_'+db.classname+' .wan_uptime').html(uptime2dhms(db.uptime, 3));
						}
					}	
				}
			}
			else if(!wan_up && !cpe_up){
				$('.box_wans_'+db.classname+' .wan_uptime').text(empty_val);
			}

			var address_count = 0;
			$.each(db, function(key, value){
				if(key.indexOf("ipaddrs") != -1){
					address_count++;
				}
			});
			var append_html = "<div class='col-sm-3 col-xs-4 text-left'>DNN IP:</div><div class='col-sm-9 col-xs-8 text-right no_paddingLeft hidden-lg dnn_ip'></div><div class='col-sm-9 col-xs-8 text-right no_paddingLeft visible-lg dnn_ip'></div>";
			var dnn_ip = "";
			if(address_count>1){
				$('.box_wans_'+db.classname+' .wan_multi_ip').html(append_html).css("display","block");
			}
			else{
				$('.box_wans_'+db.classname+' .wan_multi_ip').css("display","none");
			}
			for(var index =0;index<address_count;index++){
				var addr_key = "ipaddrs";
				var class_key = "wan_ip";
				if(index>0){
					addr_key+=index;
					class_key="dnn_ip";				
				}

				if (db[addr_key] && db[addr_key].length) {
					for(i=0;i<db[addr_key].length;i++){
						var ip_show = db[addr_key][i].ipaddr;
						if (ip_show){
							var split_index = ip_show.search("/");
							if(-1 != split_index){
								ip_show = ip_show.substr(0, split_index);
							}
							var title_info = $('.box_wans_'+db.classname+' .'+class_key).data("ip") || "";
							$('.box_wans_'+db.classname+' .'+class_key).data("ip",title_info+" "+ip_show);
							$('.box_wans_'+db.classname+' .'+class_key).prop("title",title_info+" "+ip_show);

							var ip_count = $('.box_wans_'+db.classname+' .'+class_key).data("ip_count");
							if(!ip_count)
								ip_count=0;
							ip_count++;
							var cat_ip_show=ip_show;
							if(ip_show.indexOf(":")!=-1){
								var ip_len = ip_show.length;
								if(ip_len>17){
									cat_ip_show=ip_show.substr(0,17)+"...";
								}					
							}
							if(ip_count<=2){
								$('.box_wans_'+db.classname+' .hidden-lg.'+class_key).append('<div onclick="toggle_eye_show(this,secretshow)">'+secret_show(cat_ip_show)+'</div>');
								$('.box_wans_'+db.classname+' .visible-lg.'+class_key).append('<div onclick="toggle_eye_show(this,secretshow)">'+secret_show(ip_show)+'</div>');
								$('.box_wans_'+db.classname+' .'+class_key).data("ip_count",ip_count);
							}
						}
						var mask_show = db[addr_key][i].netmask;
						if (mask_show){
							if(index==0){
								$('.box_wans_'+db.classname+' .wan_mask').append(mask_show+"<br>");
							}
						}
					}
				}
			}
				
			var cpe_info = get_cpe_data(db.classname ,cpe_data);
			var cellular_as_wan = 0;
			if (cpe_info && cpe_info.net_kind){
				if (cpe_info.net_kind == "" && cpe_info.net_type == "Wired"){
					cellular_as_wan = 1;
				}
				else if ((cpe_info.net_kind == "Priority")  && (cpe_info.net_type && cpe_info.net_type.indexOf("Wired") != -1) ){
					cellular_as_wan = 1;
					wan_up = true;
				}
			}
			if(cpe_info)
				cpe_info.cellular_as_wan = cellular_as_wan;
			wan_item.cellular_as_wan = cellular_as_wan;
			$('.box_wans_'+db.classname).data('cellular_as_wan',"0");
			if((wan_item.type == "wired") || cellular_as_wan){
				if(low_cpu)			
					speed_show(wan_item,db.upload,db.download,interval);
				if(cellular_as_wan)
					$('.box_wans_'+db.classname).data('cellular_as_wan',"1");
	
				flow_show(wan_item,db.upload,db.download);
				if(cellular_as_wan){
					port_link = nbcpe_linked;
				}
				else{
					port_link = isWanLinked;
				}
				if($("#progress-container-"+db.classname+"single").length)
					wan_item.arcProgressSingle = wan_show(wan_item.arcProgressSingle,"progress-container-"+db.classname+"single",port_link,wan_up?1:0);
				if($("#progress-container-"+db.classname+"multi").length)
					wan_item.arcProgressMulti = wan_show(wan_item.arcProgressMulti,"progress-container-"+db.classname+"multi",port_link,wan_up?1:0);
				if(db.gateway)
					$(".box_wans_"+db.classname+" .wired_gateway").append('<div onclick="toggle_eye_show(this,secretshow)">'+secret_show(db.gateway)+'</div>');
				if(db.proto == "pppoe"){
					$(".box_wans_"+db.classname+" .pppoe").css("display","block");
					$(".box_wans_"+db.classname+" .wired_username").html(db.username);
					$(".box_wans_"+db.classname+" .wired_password").html(secret_show(db.password));
				}
				else{
					$(".box_wans_"+db.classname+" .pppoe").css("display","none");
				}
				$(".box_wans_"+db.classname+" .wired_type").html(db.proto_text);
			}
		});

		$(".stand_net_box").each(function(){
			var disabled_status = $(this).data('disabled');
			var cellular_as_wan_status = $(this).data('cellular_as_wan');
			var child_cpe_box_show = "block";
			var child_box_box_show = "none";
			if(disabled_status == "1"){
				$(this).css('display',"none");
			}
			else{
				if(cellular_as_wan_status == "1"){
					child_cpe_box_show = "none";
					child_box_box_show = "block";
					$(this).find(".rtemp_label").html("CPU Usage");	
					//$(this).find(".pre_info").html("");
					$(this).find(".rtemp_label").html("CPU Usage");
				}

				if($(this).hasClass("cpe_box")){
					var sortindex = $(this).data("cpeindex");
					if(has_cpe && (sortindex <= cpe_count)){
						$(this).css('display',"block");
					}
					else{
						$(this).css('display',"none");
					}
					
					$(this).find(".cpe_box").css('display',child_cpe_box_show);
					$(this).find(".wan_box").css('display',child_box_box_show);
				}
				else{
					child_cpe_box_show = "none";
					child_box_box_show = "block";
					$(this).css('display',"block");
					$(this).find(".cpe_box").css('display',child_cpe_box_show);
					$(this).find(".wan_box").css('display',child_box_box_show);
				}				
			}
		});
	}
}

function get_wan_link(data,nbcpe){
	var wan_linked = 0;
	var belong_cmp = 0;
	if (!data){
		return wan_linked;
	}
	if(nbcpe)
		belong_cmp = 1;
	$.each(data, function (i, db) {
		if ((db.mode == 1) && (db.belong == belong_cmp) && (db.status == 0 && parseInt(db.speed) > 0))
			wan_linked++;
	});

	return wan_linked;
}

function format_cpu_val(value){	
	if(value<=50){
		return "Idle";
	}
	else if(value<=75){
		return "Light";
	}
	else if(value<=85){
		return "Normal";
	}
	else if(value<=95){
		return "Busy";
	}
	else{
		return "Critical";
	}
}

function format_mem_val(value){
	if(value<=50){
		return "Plenty";
	}
	else if(value<=75){
		return "Enough";
	}
	else if(value<=85){
		return "Normal";
	}
	else if(value<=95){
		return "Tight";
	}
	else{
		return "Critical";
	}
}
function format_temp_des(value){
	if(value.length == 0)
		return "";
	if(value<=60){
		return "Great";
	}
	else if(value<=75){
		return "Fine";
	}
	else if(value<=85){
		return "High";
	}
	else if(value<=95){
		return "Hot";
	}
	else{
		return "Alert";
	}
}

function format_temp_val(value){
	if(!value || value == "" )
		return "-";
	var data = parseInt(value);
	if(data <=0 || data >300)
		return "-";
	return data+"℃";
}

function speed_show(wan_item,upload_bytes,download_bytes,speed_interval){
	if(!wan_item)
		return;
	var cur_upload = (upload_bytes == undefined)?0:parseInt(upload_bytes);
	var cur_download = (download_bytes == undefined)?0:parseInt(download_bytes);
	var bytes_data = "";
	if (wan_item.ulbytes == 0 || wan_item.ulbytes >= cur_upload) {
		bytes_data = nradio_rate_format(0).split(" ");
	}
	else {
		bytes_data = nradio_rate_format((cur_upload-wan_item.ulbytes)*8/speed_interval).split(" ");
	}
	$(".box_wans_"+wan_item.name+" .speedup_data").html(bytes_data[0]);
	$(".box_wans_"+wan_item.name+" .speedup_unit").html(bytes_data[1]?bytes_data[1]:"bps");

	if (wan_item.dlbytes == 0 || wan_item.dlbytes >= cur_download) {
		bytes_data = nradio_rate_format(0).split(" ");
	}
	else {
		bytes_data = nradio_rate_format((cur_download-wan_item.dlbytes)*8/speed_interval).split(" ");
	}

	$(".box_wans_"+wan_item.name+" .speeddown_data").html(bytes_data[0]);
	$(".box_wans_"+wan_item.name+" .speeddown_unit").html(bytes_data[1]?bytes_data[1]:"bps");

	wan_item.ulbytes = cur_upload;
	wan_item.dlbytes = cur_download;
}

function get_speed_data(){
	var data_name = "";
	var sim_id = 0;
	for(var i=0;i<wans_data.length;i++){
		 if(wans_data[i].disabled != "1"){
			if (data_name.length)
				data_name+=",";
			data_name +=wans_data[i].name;
		 }
	}
	if(!data_name.length)
		return;

	$.getJSON('/cgi-bin/luci/nradio/status/speed/'+data_name, function(data) {
		if(data && data.result && data.result.list){
			for(var i = 0;i<data.result.list.length;i++){
				var status = data.result.list[i];
				var wan_item = get_wans_item(status.name,wans_data);
				speed_show(wan_item,status.upload,status.download,speed_interval);
			}
		}
	});
}

function reset_wans_item(wans_data){
	for(var i=0;i<wans_data.length;i++){
		 wans_data[i].disabled = "1";
	}
	return null;
}

function reset_box_speed(wans_data){
	var show_count = 0;
	var item = null;
	var index = 0;
	for(var i=0;i<wans_data.length;i++){
		 if(wans_data[i].disabled != "1"){
			speed_show(wans_data[i],0,0,speed_interval);
		 }
	}
}


function flow_show(wan_item,upload_bytes,download_bytes){
	if(!wan_item)
		return;
	var cur_upload = (upload_bytes == undefined)?0:parseInt(upload_bytes);
	var cur_download = (download_bytes == undefined)?0:parseInt(download_bytes);
	var bytes_data = nradio_byte_format(parseInt(cur_upload),"","B",1).split(" ");

	$(".box_wans_"+wan_item.name+" .flowup_data").html(bytes_data[0]);
	$(".box_wans_"+wan_item.name+" .flowup_unit").html(bytes_data[1]?bytes_data[1]:"B");

	bytes_data = nradio_byte_format(parseInt(cur_download),"","B",1).split(" ");
	$(".box_wans_"+wan_item.name+" .flowdown_data").html(bytes_data[0]);
	$(".box_wans_"+wan_item.name+" .flowdown_unit").html(bytes_data[1]?bytes_data[1]:"B");

}
