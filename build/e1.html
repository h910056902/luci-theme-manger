		function uptime2dhms(uptime, max = 5, delim = ' '){
			if(!uptime){
				return "-";
			}
			var dhms=[];
			if (uptime >= 60*60*24){
				dhms.push(Math.floor(uptime/(60*60*24))+'d');
			}
			if (uptime >= 60*60){
				dhms.push(Math.floor(uptime%(60*60*24)/60/60)+'h');
			}
			if (uptime >= 60){
				dhms.push(Math.floor(uptime%(60*60)/60)+'m');
			}
			dhms.push(Math.floor(uptime%60)+'s');
			return dhms.slice(0, max).join(delim);
		}

			$('form').each(function() {
				var v = $(this).validate({
					errorPlacement: function(error, element) {
						if ($(element).next('span.glyphicon').length > 0) {

								$(element).parent().next('div.empty').prepend(error);

								.children().last().after(error);
						}

				});

				$('.cbi-button-apply').click(function() {

			});

				}
			}

			}
		});

	<script>
		var	gSmsIfaces = null;
		var gSmsUnread = 0;
		
		GlobalSyncRQ.sms_unread = 1;
		
		
		
		function render_sms_badge(count,clean){
			var $badge = $('.sms-badge');
			if(!$badge.length) return;
			if(clean){
				$('.sms-li').addClass("blink");
				$badge.removeClass('hide').html('<i class="far fa-nradio-del fa-fw" ></i> ');
			}
			else if(!count || count <= 0){
				$('.sms-li').removeClass("blink");
				$badge.addClass('hide').text('');
			}else{
				$('.sms-li').removeClass("blink");
				$badge.removeClass('hide').text(count > 99 ? '99+' : String(count));
			}
		}
		function sms_unread_core(data){
			gSmsIfaces = null;
			var count = 0;
			var total = 0;
			var used = 0;
			var clean_flag = 0;
			
			if(data){
				for( var i = 0; i < data.length; i++){
					var item = data[i];
					if (item.max)
						total+=item.max;
					if (item.used)
						used+=item.used;
					if(item.count > 0 && item.iface){
						gSmsIfaces = item.iface;
						count = item.count + count;
					}
				}
				gSmsUnread = count;
				if(total && (used*100/total >= 90))
					clean_flag = 1;
				
				//console.log("used:"+used+",total:"+total+" "+used*100/total);
				render_sms_badge(count,clean_flag);
			}
		}
		function refresh_sms_badge(){
			if(GlobalSyncRQ.runtime || GlobalSyncRQ.cellinfo || GlobalSyncRQ.celldevice || GlobalSyncRQ.siminfo || GlobalSyncRQ.client)
				return;
			(new XHR()).get('/cgi-bin/luci/nradio/cellular/sms/unread', null, function(xhr){
				if (xhr.getResponseHeader("Content-Type") == "application/json") {
					try {
						var data_res = eval('(' + xhr.responseText + ')');
						if(data_res && data_res.result && data_res.result.sms_unread && data_res.result.sms_unread.length > 0){
							sms_unread_core(data_res.result.sms_unread);
						}					
					}
					catch(e) {
					}
				}
			});
		}
		function goto_cellular_sms(){
			if (!gSmsIfaces)
				window.location = '/cgi-bin/luci//nradio/cellular/sms';
			else
				window.location = '/cgi-bin/luci//nradio/cellular/sms/model/' + gSmsIfaces;
		}

		function get_each_menu(menu,index,lastname){
			var box_class="";
			var menu_index=index;
			var menu_data = menu;
			var menu_list = null;
			var father_name = "";
			var style = "";
			var pre_name = lastname?lastname:"main";
			if(!menu_index){
				father_name="main";
				menu_list = menu_data;
			}
			else{
				father_name=menu.name;		
				menu_list = menu_data.sub_menu;
				style = "style='display:none'";
			}
			box_class=father_name+"_menu_box";
			if(!menu_list)
				return "";
			var sub_htm = "";
			var htm = "";
				htm+='	<div data-father="'+pre_name+'" class="mobile_bg_color panel panel-info device-panel menu_box '+box_class+'" '+style+'>';

				htm+='			<h3 class="panel-title"</h3>';
				htm+='		</div>';
				htm+='		<div class="panel-body info-box2">';
			var line = "";
			var has_sub = 0;
			var first_index = 0;
			for(var i=0;i<menu_list.length;i++){
				var icon_info = "";
				if(menu_list[i].name == "index"){
					first_index=1;
					continue;
				}

				if(i>first_index)
					line="line_top_class";
				has_sub = 0;
				if(menu_list[i].sub_menu){
					sub_htm+=get_each_menu(menu_list[i],(menu_index+1),father_name);
					has_sub=1;
				}
				if(menu_list[i].name == "cellular")
					icon_info='<i class="far fa-podcast"></i>&nbsp;&nbsp;';
				else if(menu_list[i].name == "wifi")
					icon_info='<i class="far fa-nradio-wifi" style="width:14px"></i>&nbsp;&nbsp;';
				else if(menu_list[i].name == "wan")

				else if(menu_list[i].name == "client")

				else if(menu_list[i].name == "appcenter" && father_name!="system")
					icon_info='<i class="far fa-nradio-appcenter"></i>&nbsp;&nbsp;';
				else if(menu_list[i].name == "advanced")
					icon_info='<i class="far fa-nradio-advanced-setting"></i>&nbsp;&nbsp;';

				htm+='			<div class="row '+line+'">';
				htm+='				<div class="col-sm-12 col-xs-12 text-left no_padding" data-father="'+father_name+'" data-name="'+menu_list[i].name+'"  data-url="'+menu_list[i].url+'" data-language="'+menu_list[i].language+'" onclick="show_menu(this,'+has_sub+')">';
				htm+='					<div class="row padding_fix ">';
				htm+='						<div class="col-sm-6 col-xs-6 text-left no_padding" >';
				htm+='							'+((father_name=="advanced")?"":icon_info)+menu_list[i].language;
				htm+='						</div>';
				htm+='						<div class="col-sm-6 col-xs-6 text-right sub_label_color" >';
				htm+='							<div style="display: inline-block"></div>&nbsp;&nbsp;&nbsp;';
				htm+='							<div class="next-button" >';
				htm+='								&nbsp;';
				htm+='							</div>';
				htm+='						</div>';
				htm+='					</div>';
				htm+='				</div>';
				htm+='			</div>';

			}		
				htm+='		</div>';
				htm+='	</div>';
				htm+=sub_htm;
				return htm;
		}

<script>
	function blur_lang_switch(e){
		setTimeout(function(){
			var $bubble = $('#syslang_bubble');
			if($bubble.is(':hidden')) return;
			if ($(document.activeElement).closest('#syslang_bubble').length > 0) 
				return;
			$bubble.hide();
			$(document).off('.syslang_bubble');
		}, 10);
	}

	function confirm_switch_language(el){
		var $bubble = $('#syslang_bubble');
		if($bubble.is(':visible')){
			$bubble.hide();
			$(document).off('.syslang_bubble');
			return;
		}

		$bubble.show();
		$bubble.focus();

		$bubble.off('focusout').on('focusout', function(e){
			setTimeout(function(){
				if ($(document.activeElement).closest('#syslang_bubble').length > 0)
					return;
				if ($(document.activeElement).closest(el).length > 0)
					return;
				$bubble.hide();
				$(document).off('.syslang_bubble'); 
			}, 10);
		});

		$bubble.find('.lang-opt').off('click').on('click', function(){
			var selectedLang=$(this).data('lang');
			$bubble.hide();
			$(document).off('.syslang_bubble');
			apply_lang(selectedLang);
		});
		$(document).off('click.syslang_bubble touchstart.syslang_bubble pointerdown.syslang_bubble keyup.syslang_bubble')
			.on('click.syslang_bubble touchstart.syslang_bubble pointerdown.syslang_bubble', function(e){
				if(!$(e.target).closest('#syslang_bubble').length && !$(e.target).closest(el).length){
					$bubble.hide();
					$(document).off('.syslang_bubble');
				}
			})
			.on('keyup.syslang_bubble', function(e){
				if(e.key === 'Escape'){ 
					$bubble.hide();
					$(document).off('.syslang_bubble');
				} 
			});
	}

	function apply_lang(lang){
		var data={};
		data['lang']=lang;
		(new XHR()).post('/cgi-bin/luci/admin/syslang', data, function(){
			location.reload();
		});
	}
	function confirm_lang(){
		$(".sub_lang_list").html("");
		var htm = "";
		for (const key in languages_info) {
			if (languages_info.hasOwnProperty(key)) {
				if (key.charAt(0)=='.')
					continue;
				htm+='<a class="lang-opt" data-lang="'+key+'"">'+languages_info[key]+'</a>';
			}
		}
		$("#syslang_bubble").append(htm);
	}
	confirm_lang();
</script>
