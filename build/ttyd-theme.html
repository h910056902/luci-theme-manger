<style id="kp-term-theme">
/* 1:1 复刻 iStoreOS / LuCI ttyd overview 的终端外观：
   纯黑底、等宽 courier、5px 8px 内边距、无顶栏无卡片 */
html,body{height:100%;margin:0;background:#000!important;color:#fff;
	font-family:"courier-new",Courier,monospace!important;overflow:hidden}

/* 终端占满视口（LuCI 版是 80vh，因为上方有页面标题；独立页用 100vh 等价） */
.xterm{background:#000!important}
.xterm-viewport{background:#000!important}
.xterm{padding:5px 0 0 8px!important;box-sizing:border-box}

/* 细滚动条，保持原生黑底观感 */
.xterm-viewport::-webkit-scrollbar{width:10px}
.xterm-viewport::-webkit-scrollbar-track{background:#000}
.xterm-viewport::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:0}
.xterm-viewport::-webkit-scrollbar-thumb:hover{background:#555}

/* ttyd 自带的断线/重连遮罩：回到 LuCI 那种朴素提示，不加装饰 */
#overlay,.modal,.reconnect{background:rgba(0,0,0,.82)!important}
#overlay > div,.modal > div{background:#111!important;border:1px solid #333!important;
	border-radius:2px!important;color:#eee!important;font-family:inherit!important}
</style>
<script>
(function () {
	/* 保持默认 xterm 配色（黑底白字），不做主题覆盖 */
	var tries = 0;
	var timer = setInterval(function () {
		tries++;
		if (document.querySelector('.xterm')) clearInterval(timer);
		if (tries > 100) clearInterval(timer);
	}, 200);
})();
</script>
